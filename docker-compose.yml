services:
  backend:
    build: ./backend
    container_name: teacherhub-backend
    restart: unless-stopped
    environment:
      TEACHER_HUB_DATA_DIR: /data
      TEACHER_HUB_JWT_SECRET: ${TEACHER_HUB_JWT_SECRET:-change-me-in-production-please}
    volumes:
      - teacherhub-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: teacherhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  teacherhub-data:
